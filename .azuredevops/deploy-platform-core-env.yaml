name: 1.0.$(BuildID)

parameters:
  - name: deployFromFeature
    displayName: "Deploy from Feature Branch"
    type: boolean
    default: false
  - name: applicationID
    displayName: "Application ID (config folder name, e.g. aie)"
    type: string
    default: 'aie'
  - name: instance
    displayName: "Instance (config folder name, e.g. 01)"
    type: string
    default: '01'
  # Derived in config, however has to be supplied to allow the regional config to work. Validation step confirms config matches supplied values.
  - name: environmentName
    displayName: "Environment name for config path (e.g. snd1). Must match config/regional/{environment}-{region}.yaml and config."
    type: string
    default: 'snd1'
  - name: location
    displayName: "Primary region key for config path (e.g. uksouth). Must match config and config/regional/{environment}-{region}.yaml."
    type: string
    default: 'uksouth'
pr:
  branches:
    include:
      - main
  paths:
    include:
      - infra/core/env/*
      - infra/common/*
  drafts: false
        
trigger:
  batch: true
  branches:
    include:
      - '*'
  paths:
    include:
      - infra/core/env/*
      - infra/common/*
     
variables:
  - group: entra
  - name: applicationID
    value: ${{ parameters.applicationID }}
  - name: instance
    value: ${{ parameters.instance }}
  # Validation requires non-empty RG/name values before set-resource-names runs; these are overridden in deployment flow.
  - name: virtualNetworkResourceGroup
    value: 'ValidationPlaceholderRG'
  # Validation requires a non-empty VNet name; overridden by set-resource-names.
  - name: virtualNetworkName
    value: 'ValidationPlaceholderVNet'
  - name: routeTableName
    value: 'ValidationPlaceholderRT'
  # Private link zone name from set-resource-names (e.g. for Document Intelligence).
  - name: documentIntelligencePrivateLinkZoneName
    value: ''
  # Validation needs a non-empty DI name before set-resource-names runs; overridden later.
  - name: documentIntelligenceResourceName
    value: 'ValidationPlaceholderDI'
  # infraResourceGroupName from set-resource-names.
  - name: infraResourceGroupName
    value: ''
  # Validation needs a non-empty RG target for AI DI module; overridden when APP RG is created.
  - name: servicesResourceGroup
    value: 'ValidationPlaceholderRG'
  # Validation needs a non-empty subnet token for AI DI private endpoint module; overridden by set-resource-names.
  - name: subnet3Name
    value: 'ValidationPlaceholderSUB'
  # Validation needs non-empty CAE / LAW / subnet names before set-resource-names runs; overridden later.
  - name: containerAppsEnvironmentName
    value: 'ValidationPlaceholderACE'
  - name: logAnalyticsWorkspaceName
    value: 'ValidationPlaceholderLW'
  - name: containerAppsEnvironmentSubnetName
    value: 'ValidationPlaceholderSUB'
  - name: containerAppsStorageAccountName
    value: 'validationplaceholdersto'
  # true = provision hardened StorageV2 for the CAE; false/omit = skip. Shares/mounts are product-deploy concern.
  - name: containerAppsStorage
    value: false
  # Premium FileStorage (SSD LRS) for NFSv4.1 mounts; false/omit = skip. Shares/mounts are product-deploy concern.
  - name: containerAppsNfsStorageAccountName
    value: 'validationplaceholderstonfs'
  - name: containerAppsNfsStorage
    value: false
  # Validation needs a non-empty Postgres name / subnet before set-resource-names; overridden later.
  - name: postgresFlexibleServerName
    value: 'ValidationPlaceholderPSQ'
  - name: postgresFlexibleServerSubnetName
    value: 'ValidationPlaceholderSUB'
  # subnetN (e.g. subnet5) = deploy private PostgreSQL Flexible Server on that subnet; empty/none = skip.
  - name: postgresFlexibleServer
    value: ''
  # Optional CAE system-assigned MI as extra Entra admin (set by Set-PostgresEntraAdminFromCae.ps1).
  - name: postgresCaeEntraAdminObjectId
    value: ''
  - name: postgresCaeEntraAdminPrincipalName
    value: ''
  # Validation needs a non-empty Key Vault name before set-resource-names; overridden later.
  - name: keyVaultName
    value: 'ValidationPlaceholderKVT'
  # true = deploy private platform Key Vault (KVT) in the APP RG; false/omit = skip.
  - name: keyVault
    value: false
  - name: keyVaultPrivateEndpointIp
    value: ''
  # Set when keyVault=true (via Set-ResourceNames); empty skips POSTGRES-* secret writes.
  - name: postgresKeyVaultName
    value: ''
  # Firewall virtual appliance IP for route table next hop (set in variable group or config; required when deploying route tables that use VirtualAppliance)
  - name: firewallVirtualApplianceIp
    value: ''
  - name: subnets
    value: '[]'
  - name: networkJoinGroupObjectId
    value: ''
  # Set by resolve-app-rg-contributor-group (Get-AzADGroup + SSV); used by create-platform-resource-groups.
  - name: appRgContributorObjectId
    value: ''
  # Platform resource group roles to create (in addition to INF). INF is always created first. Comma-separated, e.g. EXP,APP. Set in config (variable files).
  - name: platformResourceGroups
    value: ''
  # if no SKU then Document Intelligence is not deployed.
  - name: documentIntelligenceSku
    value: ''
  # subnetN (e.g. subnet4) = deploy internal-only Container Apps Environment on that subnet; empty/none = skip.
  - name: containerAppsEnvironment
    value: ''
  # Optional JSON array for extra private DNS A records when DI is enabled. Default empty; instance core.yaml may override.
  - name: additionalDnsConfig
    value: ''
  # Optional JSON array of { ResourceGroupName, PrivateDnsZoneName } (or legacy string zone names + regional DNS RG mapping). Default empty.
  - name: additionalDnsZonesToLink
    value: '[]'
  - template: /config/common.yaml@PltConfig
  # Regional config: path uses compile-time parameters so template resolves; must match config (validated below)
  - template: /config/regional/${{ parameters.environmentName }}-${{ parameters.location }}.yaml@PltConfig
  - template: /config/${{ parameters.applicationID }}/${{ parameters.instance }}/core.yaml@PltConfig
  # Expected values from parameters for config validation (same pipeline)
  - name: expectedEnvironment
    value: ${{ parameters.environmentName }}
  - name: expectedLocation
    value: ${{ parameters.location }}

resources:
  repositories:
    - repository: PltConfig
      name: DEFRA/plt-config
      endpoint: DEFRA
      type: github
      ref: refs/heads/main

extends:
  template: /.azuredevops/common/common-infra-deploy.yaml
  parameters:
    projectName: $(projectName)
    deployFromFeature: ${{ parameters.deployFromFeature }}
    applicationID: ${{ parameters.applicationID }}
    instance: ${{ parameters.instance }}
    additionalRepositories:
      - PltConfig
    # Single variableFiles list (PipelineCommon 1.2.x): later entries win. Compile-time paths avoid {region} in variableFiles.
    # regionalVariableFiles must be empty so regional is not merged again after core.
    variableFiles:
      - /config/common.yaml@PltConfig
      - /config/regional/${{ parameters.environmentName }}-${{ parameters.location }}.yaml@PltConfig
      - /config/${{ parameters.applicationID }}/${{ parameters.instance }}/core.yaml@PltConfig
    regionalVariableFiles: []
    environments:
      - name: ${{ parameters.environmentName }}
        serviceConnection: $(subscriptionName)
        deploymentBranches:
          - 'refs/heads/main'
        developmentEnvironment: true
        privateAgentName: 'DEFRA-COMMON-UBUNTU-SSV3'
        # primary must be compile-time (parameters) so job names are valid; config $(location) is still used at runtime via variables
        azureRegions:
          primary: ${{ parameters.location }}
    filePathsForTransform: |
      **/core/env/app-configuration/config-data/config-data.json
      **/infra/core/env/insights/aad-groups/monitoringpublishergroup.json    
      **/infra/core/env/open-ai/aad-groups/openaiaccessgroup.json
      **/infra/core/env/search-service/aad-groups/searchserviceaccessgroup.json
      **/resources/default-tags.json
    groupedDeployments:
        - name: validate_and_setup
          deployments:
              - name: validate-params-match-config
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Validate-Params-Match-Config.ps1" "$(expectedEnvironment)" "$(subType)" "$(deploymentEnvInstance)" "$(expectedLocation)" "$(location)" "$(coreVersion)" "$(Build.SourceBranchName)"
              - name: validate-additional-dns-config-json
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Validate-AdditionalDnsConfigJson.ps1" "$(documentIntelligenceSku)" '$(additionalDnsConfig)'
              - name: variable-setup
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Normalise-ApplicationId.ps1" "$(applicationID)"

        # --- Pre-reqs: all depend only on validate so they start together ---
        # Network jobs are self-contained (names + RGs + deploy) because ADO job vars do not cross groups.
        # Create-PlatformResourceGroups is idempotent; concurrent RT/NSG jobs may both ensure RGs exist.
        - name: pre_req_dns_links
          dependsOnGroupedDeployments:
            - validate_and_setup
          deployments:
              - name: link-additional-private-dns-zones
                type: 'script'
                scriptType: AzurePowerShell
                serviceConnectionVariableName: 'ssvServiceConnection'
                useSystemAccessTokeninScript: true
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Link-AdditionalPrivateDnsZones.ps1" `
                    -AdditionalDnsZonesToLink '$(additionalDnsZonesToLink)' `
                    -Location "$(location)" `
                    -RegionToDnsResourcegroupMappingTable '$(regionToDnsResourcegroupMappingTable)' `
                    -SubscriptionName "$(subscriptionName)" `
                    -TenantId "$(tenantId)" `
                    -WorkingDirectory "$(Pipeline.Workspace)/s/self"

        - name: pre_req_aad_groups
          dependsOnGroupedDeployments:
            - validate_and_setup
          deployments:
              - name: create-aad-groups
                type: 'script'
                scriptType: AzurePowerShell
                serviceConnectionVariableName: 'ssvServiceConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Invoke-CreateAadGroups.ps1" `
                    -ManifestPath "$(Pipeline.Workspace)/s/PltConfig/config/$(applicationID)/$(instance)/aad-group.json" `
                    -ScriptPath "$(Pipeline.Workspace)/s/self/scripts/pipeline/Create-AADGroups.ps1" `
                    -ClientId "$(entraSPClientId)" `
                    -TenantId "$(tenantId)" `
                    -ClientSecret "$(entraSPToken)"

        - name: pre_req_app_registrations
          dependsOnGroupedDeployments:
            - validate_and_setup
          deployments:
              - name: create-app-registrations
                type: 'script'
                scriptType: AzurePowerShell
                serviceConnectionVariableName: 'ssvServiceConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Invoke-AddAdAppRegistrations.ps1" `
                    -ManifestPath "$(Pipeline.Workspace)/s/PltConfig/config/$(applicationID)/$(instance)/app-registration.json" `
                    -ScriptPath "$(Pipeline.Workspace)/s/self/scripts/common-scripts/PowerShellLibrary/Add-AdAppRegistrations.ps1" `
                    -ClientId "$(entraSPClientId)" `
                    -TenantId "$(tenantId)" `
                    -ClientSecret "$(entraSPToken)"

        - name: pre_req_route_tables
          dependsOnGroupedDeployments:
            - validate_and_setup
          deployments:
              - name: set-resource-names
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                    -RootPath "$(Pipeline.Workspace)/s/self" `
                    -Location "$(location)" `
                    -SubType "$(subType)" `
                    -ServiceCode "$(serviceCode)" `
                    -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                    -RegionCode "$(regionCode)" `
                    -InstanceNumber "$(instanceNumber)" `
                    -SubnetLayout "$(subnetLayout)" `
                    -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                    -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                    -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)"
              - name: resolve-app-rg-contributor-group
                type: 'script'
                scriptType: AzurePowerShell
                serviceConnectionVariableName: 'ssvServiceConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Resolve-EntraGroupByDisplayName.ps1" `
                    -GroupName "$(appRgContributor)" `
                    -OutputVariableName 'appRgContributorObjectId' `
                    -IfNotFound 'Error'
              - name: create-platform-resource-groups
                type: 'script'
                scriptType: AzureCLI
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                azureCLIScriptType: pscore
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Create-PlatformResourceGroups.ps1" `
                    -RootPath "$(Pipeline.Workspace)/s/self" `
                    -SubType "$(subType)" `
                    -Location "$(location)" `
                    -AppRgContributor "$(appRgContributor)" `
                    -AppRgContributorObjectId "$(appRgContributorObjectId)" `
                    -ServiceCode "$(serviceCode)" `
                    -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                    -RegionCode "$(regionCode)" `
                    -InstanceNumber "$(instanceNumber)" `
                    -PlatformResourceGroups "$(platformResourceGroups)" `
                    -InfraResourceGroupName "$(infraResourceGroupName)"
              - name: route-table-tokens
                type: replaceTokensOnly
                replaceTokenPathsString: 'resources/network/route-table/1;resources/network/route-table/2;resources/network/route-table/3'
              - name: deploy-route-tables
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Deploy-RouteTables.ps1" `
                    -BuildSourcesDirectory "$(Pipeline.Workspace)/s/self" `
                    -ResourceGroupName "$(virtualNetworkResourceGroup)" `
                    -RouteTableName "$(routeTableName)" `
                    -Location "$(location)" `
                    -FirewallVirtualApplianceIp "$(firewallVirtualApplianceIp)" `
                    -SubnetLayout "$(subnetLayout)"

        - name: pre_req_nsgs
          dependsOnGroupedDeployments:
            - validate_and_setup
          deployments:
              - name: set-resource-names
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                    -RootPath "$(Pipeline.Workspace)/s/self" `
                    -Location "$(location)" `
                    -SubType "$(subType)" `
                    -ServiceCode "$(serviceCode)" `
                    -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                    -RegionCode "$(regionCode)" `
                    -InstanceNumber "$(instanceNumber)" `
                    -SubnetLayout "$(subnetLayout)" `
                    -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                    -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                    -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)"
              - name: resolve-app-rg-contributor-group
                type: 'script'
                scriptType: AzurePowerShell
                serviceConnectionVariableName: 'ssvServiceConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Resolve-EntraGroupByDisplayName.ps1" `
                    -GroupName "$(appRgContributor)" `
                    -OutputVariableName 'appRgContributorObjectId' `
                    -IfNotFound 'Error'
              - name: create-platform-resource-groups
                type: 'script'
                scriptType: AzureCLI
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                azureCLIScriptType: pscore
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Create-PlatformResourceGroups.ps1" `
                    -RootPath "$(Pipeline.Workspace)/s/self" `
                    -SubType "$(subType)" `
                    -Location "$(location)" `
                    -AppRgContributor "$(appRgContributor)" `
                    -AppRgContributorObjectId "$(appRgContributorObjectId)" `
                    -ServiceCode "$(serviceCode)" `
                    -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                    -RegionCode "$(regionCode)" `
                    -InstanceNumber "$(instanceNumber)" `
                    -PlatformResourceGroups "$(platformResourceGroups)" `
                    -InfraResourceGroupName "$(infraResourceGroupName)"
              - name: deploy-nsgs
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Deploy-NSGs.ps1" `
                    -BuildSourcesDirectory "$(Pipeline.Workspace)/s/self" `
                    -ResourceGroupName "$(virtualNetworkResourceGroup)" `
                    -Location "$(location)" `
                    -SubType "$(subType)" `
                    -ServiceCode "$(serviceCode)" `
                    -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                    -RegionCode "$(regionCode)" `
                    -SubnetLayout "$(subnetLayout)"

        - name: landing_zone
          dependsOnGroupedDeployments:
            - pre_req_route_tables
            - pre_req_nsgs
          deployments:
              - name: set-resource-names
                type: 'script'
                scriptType: AzureCLI
                azureCLIScriptType: pscore
                serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                inlineScript: |
                  & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                    -RootPath "$(Pipeline.Workspace)/s/self" `
                    -Location "$(location)" `
                    -SubType "$(subType)" `
                    -ServiceCode "$(serviceCode)" `
                    -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                    -RegionCode "$(regionCode)" `
                    -InstanceNumber "$(instanceNumber)" `
                    -SubnetLayout "$(subnetLayout)" `
                    -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                    -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                    -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)"
              - name: replace-vnet-tokens
                type: replaceTokensOnly
                replaceTokenPathsString: 'resources/network/vnet/$(subnetLayout)'
              - name: virtual-network
                path: resources/network/vnet
                parameterFilePath: resources/network/vnet/$(subnetLayout)
                resourceGroupName: $(virtualNetworkResourceGroup)
                preDeployScriptsList:
                    - displayName: "Resolve network join group object ID"
                      type: AzurePowerShell
                      serviceConnectionVariableName: 'ssvServiceConnection'
                      scriptPath: scripts/pipeline/Resolve-NetworkJoinGroup.ps1
                      scriptArguments: >
                        -GroupName "$(networkJoinGroupName)"
                postDeployScriptsList:
                    - displayName: "Link the VNet to Hub"
                      scriptPath: scripts/pipeline/Trigger-VNetPeering.ps1
                      type: AzurePowerShell
                      serviceConnectionVariableName: 'ssvServiceConnection'
                      useSystemAccessToken: true
                      scriptArguments: >
                        -VirtualNetworkName $(virtualNetworkName)
                        -SubscriptionName $(subscriptionName)
                        -TenantId $(tenantId)
                        -PeerToSec $false

        # --- Deploy Azure Services: parallel after VNet (add new services as sibling groups) ---
        # Private DNS zone creation (ai-document-intelligence-zone) omitted: corporate policy prevents creation in certain subscriptions. Use existing zone and add DNS lookup later. Module kept under resources/network/private-dns-zone for other scenarios.
        - ${{ if and(ne(coalesce(variables.documentIntelligenceSku, ''), ''), ne(lower(coalesce(variables.documentIntelligenceSku, '')), 'none')) }}:
          - name: azure_document_intelligence
            dependsOnGroupedDeployments:
              - landing_zone
            deployments:
                - name: set-resource-names
                  type: 'script'
                  scriptType: AzureCLI
                  azureCLIScriptType: pscore
                  serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                  inlineScript: |
                    & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                      -RootPath "$(Pipeline.Workspace)/s/self" `
                      -Location "$(location)" `
                      -SubType "$(subType)" `
                      -ServiceCode "$(serviceCode)" `
                      -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                      -RegionCode "$(regionCode)" `
                      -InstanceNumber "$(instanceNumber)" `
                      -SubnetLayout "$(subnetLayout)" `
                      -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                      -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                      -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)"
                - name: ai-document-intelligence
                  path: resources/ai/document-intelligence
                  parameterFilePath: resources/ai/document-intelligence
                  resourceGroupName: $(servicesResourceGroup)
                  preDeployScriptsList:
                      - displayName: 'Set DNS A records from additionalDnsConfig'
                        type: AzurePowerShell
                        azurePowerShellVersion: LatestVersion
                        azurePowerShellUseCore: true
                        serviceConnectionVariableName: 'privateDnsServiceConnection'
                        scriptPath: scripts/pipeline/SetDnsRecords.ps1
                        scriptArguments: >
                          -Location "$(location)"
                          -AdditionalDnsConfig '$(additionalDnsConfig)'
                          -RegionToDnsResourcegroupMappingTable '$(regionToDnsResourcegroupMappingTable)'
                          -PipelineWorkspace "$(Pipeline.Workspace)"
                          -BuildSourcesDirectory "$(Build.SourcesDirectory)"
                  postDeployScriptsList:
                      - displayName: 'Output Document Intelligence private endpoint IP for DNS'
                        type: AzureCLI
                        azureCLIScriptType: pscore
                        serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                        scriptPath: scripts/pipeline/Output-DocumentIntelligencePrivateEndpointIp.ps1
                        scriptArguments: >
                          -ResourceGroupName "$(servicesResourceGroup)"
                      - displayName: 'Set Document Intelligence private endpoint DNS A record'
                        type: AzurePowerShell
                        azurePowerShellVersion: LatestVersion
                        azurePowerShellUseCore: true
                        serviceConnectionVariableName: 'privateDnsServiceConnection'
                        scriptPath: scripts/pipeline/SetDnsRecords.ps1
                        scriptArguments: >
                          -Fqdn "$(documentIntelligenceResourceName).cognitiveservices.azure.com"
                          -IpAddress "$(documentIntelligencePrivateEndpointIp)"
                          -Location "$(location)"
                          -RegionToDnsResourcegroupMappingTable '$(regionToDnsResourcegroupMappingTable)'
                          -PipelineWorkspace "$(Pipeline.Workspace)"
                          -BuildSourcesDirectory "$(Build.SourcesDirectory)"

        - ${{ if and(ne(coalesce(variables.containerAppsEnvironment, ''), ''), ne(lower(coalesce(variables.containerAppsEnvironment, '')), 'none')) }}:
          - name: azure_container_apps
            dependsOnGroupedDeployments:
              - landing_zone
            deployments:
                - name: set-resource-names
                  type: 'script'
                  scriptType: AzureCLI
                  azureCLIScriptType: pscore
                  serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                  inlineScript: |
                    & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                      -RootPath "$(Pipeline.Workspace)/s/self" `
                      -Location "$(location)" `
                      -SubType "$(subType)" `
                      -ServiceCode "$(serviceCode)" `
                      -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                      -RegionCode "$(regionCode)" `
                      -InstanceNumber "$(instanceNumber)" `
                      -SubnetLayout "$(subnetLayout)" `
                      -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                      -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                      -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)"
                - name: container-apps-environment
                  path: resources/app/container-apps-environment
                  parameterFilePath: resources/app/container-apps-environment
                  resourceGroupName: $(servicesResourceGroup)
                  postDeployScriptsList:
                      - displayName: 'Output Container Apps Environment private DNS zone for hub linking'
                        type: AzureCLI
                        azureCLIScriptType: pscore
                        serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                        scriptPath: scripts/pipeline/Output-ContainerAppsEnvironment.ps1
                        scriptArguments: >
                          -ResourceGroupName "$(servicesResourceGroup)"
                      - displayName: 'Link Container Apps Environment private DNS zone to hub networks'
                        type: AzurePowerShell
                        azurePowerShellVersion: LatestVersion
                        azurePowerShellUseCore: true
                        serviceConnectionVariableName: 'ssvServiceConnection'
                        useSystemAccessToken: true
                        scriptPath: scripts/pipeline/Trigger-LinkPrivateDNSZones.ps1
                        scriptArguments: >
                          -PrivateDnsZoneName "$(containerAppsEnvironmentPrivateDnsZoneName)"
                          -ResourceGroupName "$(servicesResourceGroup)"
                          -SubscriptionName "$(subscriptionName)"
                          -TenantId "$(tenantId)"
                      - ${{ if eq(lower(coalesce(variables.containerAppsStorage, 'false')), 'true') }}:
                        - displayName: 'Output Container Apps storage private endpoint IP for DNS'
                          type: AzureCLI
                          azureCLIScriptType: pscore
                          serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                          scriptPath: scripts/pipeline/Output-ContainerAppsStoragePrivateEndpointIp.ps1
                          scriptArguments: >
                            -ResourceGroupName "$(servicesResourceGroup)"
                            -StorageAccountName "$(containerAppsStorageAccountName)"
                        - displayName: 'Set Container Apps storage private endpoint DNS A record'
                          type: AzurePowerShell
                          azurePowerShellVersion: LatestVersion
                          azurePowerShellUseCore: true
                          serviceConnectionVariableName: 'privateDnsServiceConnection'
                          scriptPath: scripts/pipeline/SetDnsRecords.ps1
                          scriptArguments: >
                            -Fqdn "$(containerAppsStorageAccountName).file.core.windows.net"
                            -IpAddress "$(containerAppsStoragePrivateEndpointIp)"
                            -Location "$(location)"
                            -RegionToDnsResourcegroupMappingTable '$(regionToDnsResourcegroupMappingTable)'
                            -PipelineWorkspace "$(Pipeline.Workspace)"
                            -BuildSourcesDirectory "$(Build.SourcesDirectory)"
                      - ${{ if eq(lower(coalesce(variables.containerAppsNfsStorage, 'false')), 'true') }}:
                        - displayName: 'Output Container Apps NFS storage private endpoint IP for DNS'
                          type: AzureCLI
                          azureCLIScriptType: pscore
                          serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                          scriptPath: scripts/pipeline/Output-ContainerAppsStoragePrivateEndpointIp.ps1
                          scriptArguments: >
                            -ResourceGroupName "$(servicesResourceGroup)"
                            -StorageAccountName "$(containerAppsNfsStorageAccountName)"
                            -DeploymentAccountOutput storageNfsAccountName
                            -DeploymentPrivateEndpointOutput storageNfsPrivateEndpointName
                            -OutputAccountNameVariable containerAppsNfsStorageAccountName
                            -OutputIpVariable containerAppsNfsStoragePrivateEndpointIp
                        - displayName: 'Set Container Apps NFS storage private endpoint DNS A record'
                          type: AzurePowerShell
                          azurePowerShellVersion: LatestVersion
                          azurePowerShellUseCore: true
                          serviceConnectionVariableName: 'privateDnsServiceConnection'
                          scriptPath: scripts/pipeline/SetDnsRecords.ps1
                          scriptArguments: >
                            -Fqdn "$(containerAppsNfsStorageAccountName).file.core.windows.net"
                            -IpAddress "$(containerAppsNfsStoragePrivateEndpointIp)"
                            -Location "$(location)"
                            -RegionToDnsResourcegroupMappingTable '$(regionToDnsResourcegroupMappingTable)'
                            -PipelineWorkspace "$(Pipeline.Workspace)"
                            -BuildSourcesDirectory "$(Build.SourcesDirectory)"

        - ${{ if and(ne(coalesce(variables.postgresFlexibleServer, ''), ''), ne(lower(coalesce(variables.postgresFlexibleServer, '')), 'none')) }}:
          - name: azure_postgres
            dependsOnGroupedDeployments:
              - landing_zone
              - ${{ if eq(lower(coalesce(variables.keyVault, 'false')), 'true') }}:
                - azure_key_vault
            deployments:
                - name: set-resource-names
                  type: 'script'
                  scriptType: AzureCLI
                  azureCLIScriptType: pscore
                  serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                  inlineScript: |
                    & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                      -RootPath "$(Pipeline.Workspace)/s/self" `
                      -Location "$(location)" `
                      -SubType "$(subType)" `
                      -ServiceCode "$(serviceCode)" `
                      -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                      -RegionCode "$(regionCode)" `
                      -InstanceNumber "$(instanceNumber)" `
                      -SubnetLayout "$(subnetLayout)" `
                      -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                      -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                      -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)" `
                      -KeyVaultEnabled "$(keyVault)"
                - name: postgres-flexible-server
                  path: resources/data/postgres-flexible-server
                  parameterFilePath: resources/data/postgres-flexible-server
                  resourceGroupName: $(servicesResourceGroup)
                  preDeployScriptsList:
                      - displayName: 'Resolve optional CAE Entra admin for PostgreSQL'
                        type: AzureCLI
                        azureCLIScriptType: pscore
                        serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                        scriptPath: scripts/pipeline/Set-PostgresEntraAdminFromCae.ps1
                        scriptArguments: >
                          -ResourceGroupName "$(servicesResourceGroup)"
                          -ContainerAppsEnvironmentName "$(containerAppsEnvironmentName)"
                  postDeployScriptsList:
                      - displayName: 'Output PostgreSQL private DNS zone for hub linking'
                        type: AzureCLI
                        azureCLIScriptType: pscore
                        serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                        scriptPath: scripts/pipeline/Output-PostgresFlexibleServer.ps1
                        scriptArguments: >
                          -ResourceGroupName "$(servicesResourceGroup)"
                          -PostgresFlexibleServerName "$(postgresFlexibleServerName)"
                      - displayName: 'Link PostgreSQL private DNS zone to hub networks'
                        type: AzurePowerShell
                        azurePowerShellVersion: LatestVersion
                        azurePowerShellUseCore: true
                        serviceConnectionVariableName: 'ssvServiceConnection'
                        useSystemAccessToken: true
                        scriptPath: scripts/pipeline/Trigger-LinkPrivateDNSZones.ps1
                        scriptArguments: >
                          -PrivateDnsZoneName "$(postgresFlexibleServerPrivateDnsZoneName)"
                          -ResourceGroupName "$(servicesResourceGroup)"
                          -SubscriptionName "$(subscriptionName)"
                          -TenantId "$(tenantId)"

        - ${{ if eq(lower(coalesce(variables.keyVault, 'false')), 'true') }}:
          - name: azure_key_vault
            dependsOnGroupedDeployments:
              - landing_zone
            deployments:
                - name: set-resource-names
                  type: 'script'
                  scriptType: AzureCLI
                  azureCLIScriptType: pscore
                  serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                  inlineScript: |
                    & "$(Pipeline.Workspace)/s/self/scripts/pipeline/Set-ResourceNames.ps1" `
                      -RootPath "$(Pipeline.Workspace)/s/self" `
                      -Location "$(location)" `
                      -SubType "$(subType)" `
                      -ServiceCode "$(serviceCode)" `
                      -DeploymentEnvInstance "$(deploymentEnvInstance)" `
                      -RegionCode "$(regionCode)" `
                      -InstanceNumber "$(instanceNumber)" `
                      -SubnetLayout "$(subnetLayout)" `
                      -AdiPrivateLinkZoneSuffix "$(adiPrivateLinkZoneSuffix)" `
                      -ContainerAppsEnvironmentSubnet "$(containerAppsEnvironment)" `
                      -PostgresFlexibleServerSubnet "$(postgresFlexibleServer)"
                - name: key-vault
                  path: resources/security/key-vault
                  parameterFilePath: resources/security/key-vault
                  resourceGroupName: $(servicesResourceGroup)
                  postDeployScriptsList:
                      - displayName: 'Output Key Vault private endpoint IP for DNS'
                        type: AzureCLI
                        azureCLIScriptType: pscore
                        serviceConnectionVariableName: 'mstAzureResourceManagerConnection'
                        scriptPath: scripts/pipeline/Output-KeyVaultPrivateEndpointIp.ps1
                        scriptArguments: >
                          -ResourceGroupName "$(servicesResourceGroup)"
                          -KeyVaultName "$(keyVaultName)"
                      - displayName: 'Set Key Vault private endpoint DNS A record'
                        type: AzurePowerShell
                        azurePowerShellVersion: LatestVersion
                        azurePowerShellUseCore: true
                        serviceConnectionVariableName: 'privateDnsServiceConnection'
                        scriptPath: scripts/pipeline/SetDnsRecords.ps1
                        scriptArguments: >
                          -Fqdn "$(keyVaultName).vault.azure.net"
                          -IpAddress "$(keyVaultPrivateEndpointIp)"
                          -Location "$(location)"
                          -RegionToDnsResourcegroupMappingTable '$(regionToDnsResourcegroupMappingTable)'
                          -PipelineWorkspace "$(Pipeline.Workspace)"
                          -BuildSourcesDirectory "$(Build.SourcesDirectory)"

